[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpilot-mini-swe-active-iteration"
version = "0.1.0"
description = "Isolated mini-SWE-agent experiment for OpenPilot active iteration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent==2.4.6",
    "pyarrow>=21,<26",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
